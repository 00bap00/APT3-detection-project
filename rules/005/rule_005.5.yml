title: Systemctl Service Management Activity
status: experimental
id: adb297c8-d7cf-498d-8849-4e6ebd31121c
description: Detects systemctl commands used to manage systemd services on a Linux host.
author: bap

logsource:
    category: process_creation
    product: linux
    service: auditd

detection:
    selection:
        CommandLine|contains:
            - 'systemctl start '
            - 'systemctl stop '
            - 'systemctl restart '
            - 'systemctl reload '
            - 'systemctl enable '
            - 'systemctl disable '
            - 'systemctl daemon-reload'
            - 'systemctl status '

    condition: 
        selection

falsepositives:
    - Legitimate system administration
    - Software installation and package management
    - Configuration management tools
    - System maintenance

tags:
    - attack.t1569.003

references:
    - https://attack.mitre.org/techniques/T1569/003/

level: low
