title: Rule  - service staging on linux host
status: experimental
id: adb2978c-d7cf-498d-8849-4e6ebd31121c
description: this rule detects service staging on a linux host
author: bap

logsource:
    category: process_creation
    product: linux
    service: auditd

detection:
    selection_volatile_paths:
        CommandLine|contains:
            - '/tmp/'
            - '/var/tmp/'
            - '/dev/shm/'

    selection_systemd_paths:
        CommandLine|contains:
            - '/etc/systemd/system/'
            - '/usr/lib/systemd/system/'
            - '/lib/systemd/system/'
            - '/run/systemd/system/'

    condition:
        selection_volatile_paths and selection_systemd_paths
        
falsepositives:
    - legitimate service installation or updates on a linux host

tags:
    - attack.t1543.002

references:
    - https://attack.mitre.org/techniques/T1543/002/

level: medium
