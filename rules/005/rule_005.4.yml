title: Rule - Service Staging on Linux Host
status: experimental
id: 64820653-b6b7-492b-a834-d400454a553f
description: This rule detects service staging on a Linux host
author: FSOC-1

logsource:
    category: process_creation
    product: linux
    service: auditd

detection:
    selection_volatile_paths:
        CommandLine|contains:
            - '/tmp/'
            - '/var/tmp/'
            - '/dev/shm/'

selection_systemd_paths:
    CommandLine|contains:
        - '/etc/systemd/system/'
        - '/usr/lib/systemd/system/'
        - '/lib/systemd/system/'
        - '/run/systemd/system/'

condition: selection_volatile_paths and selection_systemd_paths

falsepositives:
    - Legitimate service installation or updates on a Linux host
tags:
    - attack.t1543.002

references:
    - https://attack.mitre.org/techniques/T1543/002/

level: medium
