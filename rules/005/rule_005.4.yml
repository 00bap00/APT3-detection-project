title: 005.4 - Service Staging on Linux Host
id: 64820653-b6b7-492b-a834-d400454a553f
status: experimental
description: This rule detects service staging on a Linux host
references:
    - https://attack.mitre.org/techniques/T1543/002/
author: FSOC-1
tags:
    - attack.t1543.002
    - attack.persistence
    - attack.privilege-escalation
logsource:
    category: process_creation
    product: linux
detection:
    selection_binary:
        Image|endswith:
            - '/mv'
            - '/cp'
            - '/install'
            - '/ln'
    selection_systemd_paths:
        CommandLine|contains:
            - '/etc/systemd/system/'
            - '/usr/lib/systemd/system/'
            - '/lib/systemd/system/'
            - '/run/systemd/system/'
    condition: selection_binary and selection_systemd_paths
falsepositives:
    - Legitimate service installation or updates on a Linux host
level: informational
