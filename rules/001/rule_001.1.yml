title: 001.1 - File Transfer Utility Exacution
status: experimental
id: 2ee1902c-09c9-452e-a972-1ea1ee33f649
description: Detection exacution of common utilitys that may be used to transfer tools or files onto a linux host
author: bap

logsource:
    category: process_creation
    product: linux
    service: auditd

detection:
    selection_binary:
        Image|endswith:
            - '/curl'
            - '/wget'
            - '/rsync'
    selection_volitile_paths:
        CommandLine|contains:
            - '/tmp/'
            - '/dev/shm/'
            - '/var/tmp/'
    condition: selection_binary and selection_volitile_paths

falsepositives:
    - Legitimate administrative file transfer
    - software installation and update activity
    - System maintenance scripts

tags:
    - attack.t1105

references:
    - https://attack.mitre.org/techniques/T1105/

level: medium