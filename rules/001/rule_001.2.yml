title: 001.2 - Permission Modification on Linux Host
status: experimental
id: 2ee6902c-09c9-452e-a972-1ea1ee33f649
description: Detects execution of permission modifications on a Linux host
author: FSOC-1

logsource:
    category: process_creation
    product: linux
    service: auditd

detection:
    selection_binary:
        Image|endswith:
            - 'chmod'
    selection_executable_flags:
        CommandLine|contains:
            - '+x'
            - '777'
            - '755'
            - '700'
            - 'u+x'
    condition:
        selection_binary and selection_executable_flags

falsepositives:
    - New software implementation
    - Maintenance windows

tags:
    - attack.t1222.002

references:
    - https://attack.mitre.org/techniques/T1222/002/

level: medium
