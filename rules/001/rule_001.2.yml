title: 001.2 - Permission Modification on Linux Host
id: 2ee6902c-09c9-452e-a972-1ea1ee33f649
status: experimental
description: Detects execution of permission modifications on a Linux host
references:
    - https://attack.mitre.org/techniques/T1222/002/
author: FSOC-1
tags:
    - attack.t1222.002
    - attack.defense-evasion
logsource:
    category: process_creation
    product: linux
detection:
    selection_binary:
        Image|endswith:
            - '/chmod'
    selection_executable_flags:
        CommandLine|contains:
            - '+x'
            - '777'
            - '755'
            - '700'
    condition: selection_binary and selection_executable_flags
falsepositives:
    - New software implementation
    - Maintenance windows
level: informational
